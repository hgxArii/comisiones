 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comisiones</title>
    <link rel="stylesheet" href="ventas.css">
    <script src="ventas.js"></script>
    <script src="utilitario.js"></script>
</head>
<body>

<main class="contenedor">
    <header class="encabezado">
    <div class="icono-calculadora"> $ </div>
    <div>
    <p class="empresa">GESTIÓN COMERCIAL</p>
    <h1>Calculadora de Comisiones</h1>
    <p class="subtitulo"> Calcula tus ingresos de forma rápida y precisa</p>
    </div>

    </header>
    <section class="formulario">
    <div class="campo"><label for="txtSueldoBase"> Salario Base </label>
    <input type="text" id="txtSueldoBase" onblur="validarSueldoBase()">
    <span id="errorSueldoBase" class="mensaje-error"></span>
    </div>
    
    <div class="campo">
    <label for="txtVentas"> Número de ventas</label>
    <input type="text" id="txtVentas" onblur="validarVentas()">
    <span id="errorVentas" class="mensaje-error"></span>
    </div>
    <div class="campo">
    <label for="txtPrecio"> Precio del producto </label>
    <input type="text" id="txtPrecio" onblur="validarPrecio()">
    <span id="errorPrecio" class="mensaje-error"> </span>
    </div>

    <button type="button" onclick="calcular()"> 
    <span>Calcular Comisión</span>
    <span class="flecha"> → </span>
    </button>
    </section>

    <section class="resultados">
    <div class="titulo-resultados">
    <div class="punto"></div>
    <div>
    <h2>Resultados</h2>
    <p> Resumen de tus ingresos </p>
    </div>
    </div>
     
    <div class="resultado-item">
    <div> 
    <p class="resultado-titulo"> Salario Base </p>
    <p class="resultado-descripcion"> Ingreso mensual</p>
    </div>
    <span id="spSueldoBase" class="valor"> $0.00 </span>
    </div>

    <div class="resultado-item">
    <div>
    <p class="resultado-titulo"> Comisión </p>
    <p class="resultado-descripcion"> Comisión por ventas </p>
    </div>
    <span id="spComision" class="valor"> $0.00 </span>
    </div>

    <div class="resultado-total">
    <div>
    <p class="total-label"> TOTAL A RECIBIR </p>
    <p class="total-descripcion"> Salario + comisión </p>
    </div>
    <span id="spTotal" class="valor-total"> $0.00 </span>
    </div>
    </section>

   <footer class="pie">
   <span>Gestión Comercial</span>
   <span class="separador">•</span>
   <span>Calculadora de ingresos</span>
   </footer>

   </main>

   </body>
   </html>
